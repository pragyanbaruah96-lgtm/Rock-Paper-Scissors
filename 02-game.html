<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="02-game.css"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
</head>
<body>
    <div class="main">
        <h1 class="title">Rock Paper Scissors</h1>
        <div class="options">
            <button onclick="game('Rock')" class="rock"><img src="Rock-emoji.png" class="move"></button> 

            <button onclick="game('Paper')" class="paper"><img src="Paper-emoji.png" class="move"></button>

            <button onclick="game('Scissor')" class="scissor"><img src="Scissor-emoji.png" class="move"></button>
        </div>
        <p class="choice"></p>
        <p class="opposite"></p>
        <p class="rate"></p>

        <button onclick="score.win=0;
        score.lose=0;
        score.tie=0;
        localStorage.removeItem('score'); 
        updatescore();" class="again">Reset score</button>
        <script src="02-game.js">

        </script>
    </div>
</body>
</html>
